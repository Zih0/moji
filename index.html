<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Emoji</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      padding: 16px;
      width: 320px;
      min-height: 380px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
    }

    .app-title {
      font-size: 11px;
      font-weight: 600;
      color: #86868b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-align: center;
      margin-bottom: 16px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    #emoji-text {
      flex: 1;
      height: 36px;
      padding: 0 12px;
      font-size: 13px;
      font-family: inherit;
      border: 1px solid #d2d2d7;
      border-radius: 8px;
      background: #fff;
      color: #1d1d1f;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    #emoji-text:focus {
      border-color: #007AFF;
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.15);
    }

    #emoji-text::placeholder {
      color: #aaabb0;
    }

    button {
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.1s ease;
      outline: none;
    }

    button:active {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
      transform: none;
    }

    #generate-btn {
      height: 36px;
      padding: 0 16px;
      background: #007AFF;
      color: #fff;
      white-space: nowrap;
    }

    #generate-btn:hover:not(:disabled) {
      opacity: 0.88;
    }

    .preview-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    #preview-canvas {
      width: 128px;
      height: 128px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: #fff;
      display: none;
      transition: opacity 0.3s ease;
    }

    #preview-canvas.visible {
      display: block;
    }

    .placeholder-box {
      width: 128px;
      height: 128px;
      border: 1px dashed #d2d2d7;
      border-radius: 12px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #c7c7cc;
      font-size: 32px;
    }

    #preview-canvas.visible ~ .placeholder-box {
      display: none;
    }

    #download-btn {
      height: 32px;
      padding: 0 20px;
      background: #34C759;
      color: #fff;
      display: none;
      transition: opacity 0.3s ease;
    }

    #download-btn.visible {
      display: inline-block;
    }

    #download-btn:hover:not(:disabled) {
      opacity: 0.88;
    }

    #status {
      text-align: center;
      font-size: 12px;
      min-height: 18px;
      color: #86868b;
      transition: color 0.2s ease, opacity 0.2s ease;
    }

    #status.error {
      color: #FF3B30;
    }

    #status.success {
      color: #34C759;
    }
  </style>
</head>
<body>
  <div class="app-title">Quick Emoji</div>

  <div class="input-row">
    <input type="text" id="emoji-text" placeholder="Enter text for emoji..." autocomplete="off" spellcheck="false">
    <button id="generate-btn">Generate</button>
  </div>

  <div class="preview-area">
    <canvas id="preview-canvas" width="128" height="128"></canvas>
    <div class="placeholder-box">🎨</div>
    <button id="download-btn">Download</button>
  </div>

  <div id="status"></div>

  <script src="renderer.js"></script>
</body>
</html>
