<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Emoji</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      padding: 4px;
      width: 320px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
    }

    .app-title {
      font-size: 11px;
      font-weight: 600;
      color: #86868b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-align: center;
      margin-bottom: 12px;
    }

    #emoji-text {
      width: 100%;
      padding: 4px;
      font-size: 13px;
      font-family: inherit;
      border: 1px solid #d2d2d7;
      border-radius: 8px;
      background: #fff;
      color: #1d1d1f;
      outline: none;
      resize: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      margin-bottom: 10px;
    }

    #emoji-text:focus {
      border-color: #007AFF;
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.15);
    }

    #emoji-text::placeholder {
      color: #aaabb0;
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .control-label {
      font-size: 10px;
      font-weight: 600;
      color: #86868b;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    input[type="color"] {
      -webkit-appearance: none;
      width: 28px;
      height: 28px;
      border: 1px solid #d2d2d7;
      border-radius: 6px;
      cursor: pointer;
      padding: 2px;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: none;
      border-radius: 4px;
    }

    #font-select {
      flex: 1;
      min-width: 0;
      height: 28px;
      font-size: 11px;
      font-family: inherit;
      border: 1px solid #d2d2d7;
      border-radius: 6px;
      background: #fff;
      color: #1d1d1f;
      padding: 0 4px;
      outline: none;
    }

    .preview-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    #preview-canvas {
      width: 128px;
      height: 128px;
      border: 1px solid #ddd;
      border-radius: 12px;
      display: none;
      transition: opacity 0.3s ease;
    }

    #preview-canvas.visible {
      display: block;
    }

    .placeholder-box {
      width: 128px;
      height: 128px;
      border: 1px dashed #d2d2d7;
      border-radius: 12px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #c7c7cc;
      font-size: 32px;
    }

    #preview-canvas.visible ~ .placeholder-box {
      display: none;
    }

    /* Animation grid */
    .anim-section-label {
      font-size: 10px;
      font-weight: 600;
      color: #86868b;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      text-align: center;
      margin-bottom: 6px;
    }

    .anim-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
      max-height: 130px;
      overflow-y: auto;
      margin-bottom: 10px;
      padding: 2px;
    }

    .anim-grid::-webkit-scrollbar {
      width: 4px;
    }

    .anim-grid::-webkit-scrollbar-thumb {
      background: #d2d2d7;
      border-radius: 2px;
    }

    .anim-btn {
      font-family: inherit;
      font-size: 9px;
      font-weight: 500;
      padding: 6px 2px;
      border: 1px solid #d2d2d7;
      border-radius: 6px;
      background: #fff;
      color: #1d1d1f;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
      line-height: 1.2;
    }

    .anim-btn:hover {
      background: #e8e8ed;
    }

    .anim-btn.selected {
      background: #007AFF;
      color: #fff;
      border-color: #007AFF;
    }

    button {
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.1s ease;
      outline: none;
    }

    button:active {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
      transform: none;
    }

    #download-btn {
      height: 32px;
      padding: 0 12px;
      background: #34C759;
      color: #fff;
      display: none;
      transition: opacity 0.3s ease;
    }

    #download-btn.visible {
      display: inline-block;
    }

    #download-btn:hover:not(:disabled) {
      opacity: 0.88;
    }

    #status {
      text-align: center;
      font-size: 12px;
      min-height: 18px;
      color: #86868b;
      transition: color 0.2s ease, opacity 0.2s ease;
    }

    #status.error {
      color: #FF3B30;
    }

    #status.success {
      color: #34C759;
    }
  </style>
</head>
<body>
  <div class="app-title">Quick Emoji</div>

  <textarea id="emoji-text" placeholder="텍스트를 입력하세요..." autocomplete="off" spellcheck="false" rows="2"></textarea>

  <div class="controls">
    <select id="font-select">
      <option value="-apple-system, sans-serif">System Default</option>
    </select>
    <div class="control-group">
      <span class="control-label">배경</span>
      <input type="color" id="bg-color" value="#ffffff">
    </div>
    <div class="control-group">
      <span class="control-label">글자</span>
      <input type="color" id="font-color" value="#000000">
    </div>
  </div>

  <div class="preview-area">
    <canvas id="preview-canvas" width="128" height="128"></canvas>
    <div class="placeholder-box">🎨</div>
  </div>

  <div class="anim-section-label">Animation</div>
  <div class="anim-grid" id="anim-grid"></div>

  <div style="text-align: center; margin-bottom: 8px;">
    <button id="download-btn">Download PNG</button>
  </div>

  <div id="status"></div>

  <script src="renderer.js"></script>
</body>
</html>
