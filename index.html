<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOJI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Press Start 2P", monospace;
        background: #000;
        color: #fff;
        padding: 12px;
        width: 380px;
        -webkit-font-smoothing: none;
        image-rendering: pixelated;
        user-select: none;
      }

      /* ─── Pixel Grid Background ─── */
      .pixel-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        background: #000;
        pointer-events: none;
      }

      .pixel-bg::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        background-size: 16px 16px;
      }

      /* ─── Scanlines ─── */
      .scanlines {
        position: fixed;
        inset: 0;
        z-index: 100;
        pointer-events: none;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(255, 255, 255, 0.012) 2px,
          rgba(255, 255, 255, 0.012) 4px
        );
      }

      /* ─── Content Container ─── */
      .content {
        position: relative;
        z-index: 1;
      }

      /* ─── Hero Section: Preview ─── */
      .hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px;
        background: rgba(0, 0, 0, 0.92);
        border: 4px solid #fff;
        box-shadow: 4px 4px 0 #fff;
        margin-bottom: 12px;
        position: relative;
      }

      .hero::before {
        content: "";
        position: absolute;
        top: -4px;
        left: -4px;
        right: -4px;
        height: 20px;
        background: #fff;
      }

      .hero::after {
        content: "● ● ●";
        position: absolute;
        top: 0;
        left: 8px;
        font-size: 6px;
        letter-spacing: 3px;
        color: #000;
        font-family: monospace;
      }

      #preview-canvas {
        width: 64px;
        height: 64px;
        display: none;
        border: 4px solid #fff;
        box-shadow: 4px 4px 0 rgba(255, 255, 255, 0.2);
        margin-top: 16px;
      }

      #preview-canvas.visible {
        display: block;
      }

      #preview-canvas.transparent-bg {
        background-image:
          linear-gradient(45deg, #333 25%, transparent 25%),
          linear-gradient(-45deg, #333 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #333 75%),
          linear-gradient(-45deg, transparent 75%, #333 75%);
        background-size: 12px 12px;
        background-position:
          0 0,
          0 6px,
          6px -6px,
          -6px 0;
      }

      .placeholder-box {
        width: 64px;
        height: 64px;
        border: 4px dashed #666;
        background: #111;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #666;
        font-size: 12px;
        margin-top: 16px;
      }

      #preview-canvas.visible ~ .placeholder-box {
        display: none;
      }

      #download-btn {
        margin-top: 12px;
        height: 32px;
        padding: 0 16px;
        background: #fff;
        color: #000;
        font-size: 8px;
        font-family: "Press Start 2P", monospace;
        font-weight: 600;
        border: none;
        cursor: pointer;
        display: none;
        box-shadow: 4px 4px 0 #666;
        transition:
          transform 0.1s,
          box-shadow 0.1s;
      }

      #download-btn.visible {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      #download-btn:hover:not(:disabled) {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0 #666;
      }

      #download-btn:active:not(:disabled) {
        transform: translate(4px, 4px);
        box-shadow: none;
      }

      #download-btn:disabled {
        opacity: 0.5;
        cursor: default;
      }

      #status {
        margin-top: 8px;
        text-align: center;
        font-size: 8px;
        min-height: 16px;
        color: #888;
        line-height: 1.6;
      }

      #status.error {
        color: #ff6b6b;
      }
      #status.success {
        color: #6bff6b;
      }

      /* ─── Input Section ─── */
      .input-section {
        margin-bottom: 12px;
      }

      #emoji-text {
        width: 100%;
        padding: 12px;
        font-size: 10px;
        font-family: "Press Start 2P", monospace;
        border: 4px solid #fff;
        background: #111;
        color: #fff;
        outline: none;
        resize: none;
        box-shadow: 4px 4px 0 rgba(255, 255, 255, 0.2);
        line-height: 1.8;
      }

      #emoji-text:focus {
        background: #1a1a1a;
      }

      #emoji-text::placeholder {
        color: #666;
      }

      /* ─── Settings Cards ─── */
      .settings-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 12px;
      }

      .setting-card {
        background: rgba(0, 0, 0, 0.92);
        border: 4px solid #fff;
        box-shadow: 4px 4px 0 rgba(255, 255, 255, 0.2);
        padding: 10px;
      }

      .setting-card-label {
        font-size: 8px;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 10px;
      }

      .setting-card-content {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      /* Font Select */
      #font-select {
        flex: 1;
        width: 160px;
        height: 28px;
        font-size: 8px;
        font-family: "Press Start 2P", monospace;
        border: 2px solid #fff;
        background: #111;
        color: #fff;
        padding: 0 24px 0 8px;
        outline: none;
        cursor: pointer;
        -webkit-appearance: none;
        background-image: url("data:image/svg+xml,%3Csvg width='8' height='6' viewBox='0 0 8 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L4 4.5L7 1.5' stroke='%23fff' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
        background-repeat: no-repeat;
        background-position: right 8px center;
      }

      #font-select:focus {
        background-color: #1a1a1a;
      }

      /* Color Picker */
      .color-picker-group {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .color-picker-label {
        font-size: 8px;
        color: #fff;
        min-width: 20px;
      }

      input[type="color"] {
        appearance: none;
        -webkit-appearance: none;
        width: 28px;
        height: 28px;
        border: 2px solid #fff;
        cursor: pointer;
        padding: 0;
        background: transparent;
        box-shadow: 2px 2px 0 rgba(255, 255, 255, 0.2);
        transition: transform 0.1s;
      }

      input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 2px;
      }

      input[type="color"]::-webkit-color-swatch {
        border: none;
      }

      input[type="color"]:hover {
        transform: translate(-1px, -1px);
        box-shadow: 3px 3px 0 rgba(255, 255, 255, 0.2);
      }

      /* Toggle Switch */
      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 2px solid #333;
      }

      .toggle-row-label {
        font-size: 8px;
        color: #fff;
      }

      .toggle-switch {
        position: relative;
        width: 40px;
        height: 20px;
      }

      .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .toggle-slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: #333;
        border: 2px solid #fff;
        transition: background 0.2s;
      }

      .toggle-slider::before {
        content: "";
        position: absolute;
        height: 12px;
        width: 12px;
        left: 2px;
        bottom: 2px;
        background: #fff;
        transition: transform 0.2s;
      }

      .toggle-switch input:checked + .toggle-slider {
        background: #6bff6b;
      }

      .toggle-switch input:checked + .toggle-slider::before {
        transform: translateX(20px);
      }

      /* ─── Animation Section ─── */
      .animation-section {
        background: rgba(0, 0, 0, 0.92);
        border: 4px solid #fff;
        box-shadow: 4px 4px 0 rgba(255, 255, 255, 0.2);
        padding: 10px;
      }

      .animation-header {
        font-size: 8px;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 10px;
      }

      .anim-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
      }

      .anim-btn {
        font-family: "Press Start 2P", monospace;
        font-size: 6px;
        padding: 8px 4px;
        border: 2px solid #666;
        background: #111;
        color: #888;
        cursor: pointer;
        text-align: center;
        transition: all 0.1s;
        line-height: 1.4;
      }

      .anim-btn:hover {
        border-color: #fff;
        color: #fff;
      }

      .anim-btn:active {
        transform: translate(1px, 1px);
      }

      .anim-btn.selected {
        background: #fff;
        color: #000;
        border-color: #fff;
        box-shadow: 2px 2px 0 rgba(255, 255, 255, 0.3);
      }
    </style>
  </head>
  <body>
    <div class="pixel-bg"></div>
    <div class="scanlines"></div>

    <div class="content">
      <!-- Input (Top Priority) -->
      <div class="input-section">
        <textarea
          id="emoji-text"
          placeholder="Enter text..."
          autocomplete="off"
          spellcheck="false"
          rows="2"
        ></textarea>
      </div>

      <!-- Preview + Download -->
      <div class="hero">
        <canvas id="preview-canvas" width="128" height="128"></canvas>
        <div class="placeholder-box">Aa</div>
        <button id="download-btn">▶ DOWNLOAD</button>
        <div id="status"></div>
      </div>

      <!-- Settings -->
      <div class="settings-row">
        <div class="setting-card">
          <div class="setting-card-label">Font</div>
          <div class="setting-card-content">
            <select id="font-select">
              <option value="-apple-system, sans-serif">System</option>
            </select>
          </div>
        </div>
        <div class="setting-card">
          <div class="setting-card-label">Colors</div>
          <div class="setting-card-content">
            <div class="color-picker-group">
              <span class="color-picker-label">Bg</span>
              <input type="color" id="bg-color" value="#ffffff" />
            </div>
            <div class="color-picker-group">
              <span class="color-picker-label">Fg</span>
              <input type="color" id="font-color" value="#000000" />
            </div>
          </div>
          <div class="toggle-row">
            <span class="toggle-row-label">Trans</span>
            <label class="toggle-switch">
              <input type="checkbox" id="bg-transparent" />
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>
      </div>

      <!-- Animation -->
      <div class="animation-section">
        <div class="animation-header">Animation</div>
        <div class="anim-grid" id="anim-grid"></div>
      </div>
    </div>

    <script src="dist/renderer/renderer.js"></script>
  </body>
</html>
