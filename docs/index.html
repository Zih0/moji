<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOJI - Download</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Press Start 2P", monospace;
        background-color: #000;
        color: #fff;
        overflow: hidden;
        image-rendering: pixelated;
      }

      .pixel-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        background: #000;
      }

      .pixel-bg::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image: linear-gradient(
            rgba(255, 255, 255, 0.02) 1px,
            transparent 1px
          ),
          linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        background-size: 16px 16px;
      }

      .floating-emojis {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
      }

      .pixel-emoji {
        position: absolute;
        animation: floatUp linear infinite;
        opacity: 0;
      }

      .pixel-emoji canvas {
        image-rendering: pixelated;
        display: block;
        animation: wobble ease-in-out infinite;
      }

      @keyframes floatUp {
        0% {
          transform: translateY(100vh) rotate(0deg);
          opacity: 0;
        }
        5% {
          opacity: 0.55;
        }
        50% {
          opacity: 0.3;
        }
        95% {
          opacity: 0.12;
        }
        100% {
          transform: translateY(-80px) rotate(12deg);
          opacity: 0;
        }
      }

      @keyframes wobble {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-8px);
        }
        75% {
          transform: translateX(8px);
        }
      }

      .container {
        text-align: center;
        position: relative;
        z-index: 2;
        padding: 48px;
        border: 4px solid #fff;
        background: rgba(0, 0, 0, 0.92);
        box-shadow: 8px 8px 0 #fff;
      }

      .container::before {
        content: "";
        position: absolute;
        top: -4px;
        left: -4px;
        right: -4px;
        height: 28px;
        background: #fff;
      }

      .container::after {
        content: "● ● ●";
        position: absolute;
        top: -1px;
        left: 8px;
        font-size: 8px;
        letter-spacing: 4px;
        color: #000;
        font-family: monospace;
      }

      .logo {
        width: 96px;
        height: 96px;
        border-radius: 0;
        margin-bottom: 24px;
        margin-top: 16px;
        image-rendering: pixelated;
        border: 4px solid #fff;
        box-shadow: 4px 4px 0 rgba(255, 255, 255, 0.2);
        filter: grayscale(1) contrast(1.2);
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 12px;
        color: #fff;
        text-shadow: 3px 3px 0 rgba(255, 255, 255, 0.1);
        letter-spacing: 0.02em;
        line-height: 1.6;
      }

      .subtitle {
        font-size: 0.6rem;
        color: #888;
        margin-bottom: 32px;
        line-height: 2;
      }

      .download-btn {
        display: inline-block;
        padding: 16px 32px;
        font-size: 0.7rem;
        font-family: "Press Start 2P", monospace;
        font-weight: 600;
        color: #000;
        background-color: #fff;
        border: none;
        text-decoration: none;
        cursor: pointer;
        transition: transform 0.1s, box-shadow 0.1s;
        box-shadow: 4px 4px 0 #666;
        position: relative;
        line-height: 1.8;
      }

      .download-btn:hover {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0 #666;
      }

      .download-btn:active {
        transform: translate(4px, 4px);
        box-shadow: none;
      }

      .scanlines {
        position: fixed;
        inset: 0;
        z-index: 3;
        pointer-events: none;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(255, 255, 255, 0.012) 2px,
          rgba(255, 255, 255, 0.012) 4px
        );
      }

      .star {
        position: fixed;
        width: 4px;
        height: 4px;
        background: #fff;
        z-index: 1;
        animation: twinkle ease-in-out infinite;
      }

      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.08;
        }
        50% {
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <div class="pixel-bg"></div>
    <div class="floating-emojis" id="floatingEmojis"></div>
    <div class="scanlines"></div>

    <div class="container">
      <img src="logo.png" alt="MOJI" class="logo" />
      <h1>MOJI</h1>
      <p class="subtitle">
        Generate <br />
        Slack Emoji
      </p>
      <a
        href="https://github.com/Zih0/moji/releases/latest/download/MOJI.dmg"
        class="download-btn"
      >
        ▶ DOWNLOAD
      </a>
    </div>

    <script>
      (() => {
        // ─── Pixel Art Emoji Definitions ───
        // '#' = filled pixel, '.' = empty
        const ART = [
          // Heart
          '..##.##..\n.#######.\n#########\n#########\n.#######.\n..#####..\n...###...\n....#....',
          // Sparkle
          '...#...\n...#...\n..###..\n#######\n..###..\n...#...\n...#...',
          // Smiley
          '..####..\n.#....#.\n#.#..#.#\n#......#\n#......#\n#..##..#\n.#....#.\n..####..',
          // Ghost
          '..####..\n.######.\n##.##.##\n########\n########\n########\n#.##.##.\n.#..#..#',
          // Dice
          '########\n#......#\n#.#..#.#\n#......#\n#..##..#\n#......#\n#.#..#.#\n#......#\n########',
          // Crown
          '.#.#.#.\n##.#.##\n#######\n#######\n.#####.',
          // Music Note
          '...####\n...#..#\n...#..#\n...#...\n...#...\n####...\n#.#....\n.##....',
          // Lightning
          '....##\n...##.\n..##..\n.####.\n..##..\n.##...\n##....',
          // Diamond
          '....#....\n...###...\n..#...#..\n.#.....#.\n#.......#\n.#.....#.\n..#...#..\n...###...\n....#....',
          // Moon
          '..###..\n.##..#.\n##.....\n#......\n#......\n##.....\n.##..#.\n..###..',
          // Skull
          '.#####.\n#.....#\n#.#.#.#\n#.#.#.#\n#.....#\n.#####.\n..#.#..\n..#.#..',
          // Space Invader
          '..#...#..\n...#.#...\n..#####..\n.##.#.##.\n#########\n#.#####.#\n#.#...#.#\n...#.#...',
          // Cat
          '#.....#\n##...##\n#.#.#.#\n#..#..#\n#.....#\n#.###.#\n.#...#.\n..###..',
          // Planet
          '..####..\n.#....#.\n#..##..#\n#.#..#.#\n#..##..#\n.#....#.\n..####..',
          // Puzzle
          '..##....\n..##....\n.######.\n##...###\n##...#..\n.######.\n..##....\n..##....',
          // Cherry
          '....##..\n...#.#..\n..#..#..\n.##.##..\n#..#..#.\n#..#..#.\n.##..##.',
        ];

        const container = document.getElementById('floatingEmojis');

        // Render pixel art string to a canvas
        function render(artStr, scale) {
          const rows = artStr.split('\n');
          const h = rows.length;
          const w = Math.max(...rows.map((r) => r.length));
          const c = document.createElement('canvas');
          c.width = w * scale;
          c.height = h * scale;
          const ctx = c.getContext('2d');
          ctx.fillStyle = '#fff';
          rows.forEach((row, y) => {
            [...row].forEach((ch, x) => {
              if (ch === '#')
                ctx.fillRect(x * scale, y * scale, scale, scale);
            });
          });
          return c;
        }

        // Pre-render all emojis at 3 different scales
        const scales = [3, 4, 5];
        const cache = ART.map((a) => scales.map((s) => render(a, s)));

        function spawn() {
          const idx = Math.floor(Math.random() * ART.length);
          const si = Math.floor(Math.random() * scales.length);
          const src = cache[idx][si];

          const el = document.createElement('div');
          el.className = 'pixel-emoji';

          const canvas = document.createElement('canvas');
          canvas.width = src.width;
          canvas.height = src.height;
          canvas.getContext('2d').drawImage(src, 0, 0);
          el.appendChild(canvas);

          el.style.left = 5 + Math.random() * 90 + '%';
          el.style.animationDuration = 10 + Math.random() * 15 + 's';

          // Random wobble speed for horizontal sway
          canvas.style.animationDuration = 2 + Math.random() * 3 + 's';
          canvas.style.animationDelay = Math.random() * 2 + 's';

          container.appendChild(el);
          el.addEventListener('animationend', () => el.remove());
        }

        // Continuous spawning
        setInterval(spawn, 2000);

        // Initial burst — some start mid-flight via negative delay
        for (let i = 0; i < 12; i++) {
          setTimeout(() => {
            spawn();
            const last = container.lastElementChild;
            if (last) {
              const dur = parseFloat(last.style.animationDuration);
              const progress = Math.random() * 0.7;
              last.style.animationDelay = -progress * dur + 's';
            }
          }, i * 150);
        }

        // ─── Twinkling Stars ───
        for (let i = 0; i < 50; i++) {
          const star = document.createElement('div');
          star.className = 'star';
          star.style.left = Math.random() * 100 + '%';
          star.style.top = Math.random() * 100 + '%';
          star.style.animationDuration = 1.5 + Math.random() * 3 + 's';
          star.style.animationDelay = Math.random() * 3 + 's';
          if (Math.random() > 0.6) {
            star.style.width = '2px';
            star.style.height = '2px';
          }
          document.body.appendChild(star);
        }
      })();
    </script>
  </body>
</html>
